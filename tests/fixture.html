<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>zsxq fixture</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f7; }
  .topic { background: #fff; margin: 12px auto; padding: 16px; width: 680px; border-radius: 8px; }
  .date { color: #999; font-size: 12px; margin-bottom: 8px; }
  .file { display: inline-block; margin-top: 8px; padding: 6px 10px; border: 1px solid #ddd;
          border-radius: 4px; cursor: pointer; color: #1a6ee0; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
           align-items: center; justify-content: center; }
  #modal.open { display: flex; }
  .dialog { background: #fff; padding: 24px; border-radius: 10px; min-width: 320px; }
  .protect { color: #d33; font-size: 13px; }
  #dl { margin-top: 16px; padding: 8px 18px; }
</style>
</head>
<body>
  <div id="feed"></div>

  <div id="modal">
    <div class="dialog">
      <div id="fname"></div>
      <div id="protect" class="protect" style="display:none">请在App中查看</div>
      <button id="dl">下载文件</button>
    </div>
  </div>

<script>
  const posts = [
    { date: "10-26", files: ["2026年宏观策略.pdf", "半导体行业跟踪.pdf"], protect: false },
    { date: "10-25", files: ["消费复苏验证.pdf"], protect: false },
    { date: "10-20", files: ["会员专享研报.pdf"], protect: true },
  ];

  const feed = document.getElementById("feed");
  for (const post of posts) {
    const el = document.createElement("div");
    el.className = "topic";
    const d = document.createElement("div");
    d.className = "date";
    d.textContent = post.date;
    el.appendChild(d);
    for (const name of post.files) {
      const f = document.createElement("span");
      f.className = "file";
      f.textContent = name;
      f.addEventListener("click", () => openModal(name, post.protect));
      el.appendChild(f);
    }
    feed.appendChild(el);
  }

  let current = "";
  function openModal(name, protect) {
    current = name;
    document.getElementById("fname").textContent = name;
    document.getElementById("protect").style.display = protect ? "block" : "none";
    document.getElementById("dl").style.display = protect ? "none" : "inline-block";
    document.getElementById("modal").classList.add("open");
  }
  function closeModal() {
    document.getElementById("modal").classList.remove("open");
  }

  document.getElementById("dl").addEventListener("click", () => {
    const body = "%PDF-1.4\n% fixture " + current + "\n%%EOF\n";
    const blob = new Blob([body], { type: "application/pdf" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = current;
    document.body.appendChild(a);
    a.click();
    a.remove();
    closeModal();
  });

  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
</script>
</body>
</html>
